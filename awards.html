<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EIDL Awards</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111827;
      padding: 28px 36px 48px;
    }

    .wrap {
      width: min(1500px, 96vw);
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 40px;
      line-height: 1.15;
      color: #111827;
      letter-spacing: -0.02em;
    }

    .desc {
      margin: 0;
      color: #667085;
      font-size: 15px;
      line-height: 1.6;
    }

    .filter-note {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #f2f4f7;
      color: #475467;
      font-size: 14px;
      font-weight: 600;
    }

    .filter-note a {
      color: #263b63;
      font-weight: 800;
      text-decoration: none;
      margin-left: 8px;
    }

    .filter-note a:hover {
      text-decoration: underline;
    }

    .year-section {
      margin-top: 40px;
    }

    .year-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 24px;
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }

    .year-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .award-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
    }

    .award-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.055);
    }

    .award-thumb {
      width: 100%;
      aspect-ratio: 1 / 1.42;
      object-fit: contain;
      display: block;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
    }

    .award-placeholder {
      width: 100%;
      aspect-ratio: 1 / 1.42;
      background: linear-gradient(135deg, #eef3ff, #f8fafc);
      color: #344e7a;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.4;
      border-bottom: 1px solid #e5e7eb;
    }

    .award-body {
      padding: 18px 20px 20px;
    }

    .award-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.4;
      color: #111827;
      letter-spacing: -0.01em;
    }

    .award-date {
      margin: 12px 0 0;
      font-size: 14px;
      color: #667085;
      font-weight: 600;
    }

    .empty {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 28px;
      color: #667085;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 1200px) {
      .award-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 18px;
      }

      .wrap {
        width: 100%;
      }

      h1 {
        font-size: 34px;
      }

      .year-title {
        font-size: 24px;
      }

      .award-grid {
        grid-template-columns: 1fr;
      }

      .award-title {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="page-header">
      <h1 id="pageTitle">Awards</h1>
      <p id="pageDesc" class="desc">Honors, prizes, and awards received by EIDL members.</p>

      <div id="filterNote" class="filter-note">
        Showing awards for <span id="memberNameText"></span>.
        <a href="./awards.html">View all awards</a>
      </div>
    </header>

    <div id="awardsList">Loading...</div>
  </div>

  <script src="./data.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);

    const memberKey =
      params.get("member") ||
      params.get("memberKey") ||
      params.get("key") ||
      "";

    const memberName =
      params.get("name") ||
      params.get("memberName") ||
      "";

    let awards = window.AWARDS || [];

    awards = awards
      .filter(a => a.Title)
      .filter(a => !isFalseValue(a.Visible));

    if (memberKey) {
      awards = awards.filter(a => hasMemberKey(a.MemberKeys, memberKey));
      updateMemberHeader(memberKey, memberName);
    }

    awards = awards.sort((a, b) => {
      const dateA = String(a.Date || "");
      const dateB = String(b.Date || "");

      if (dateA && dateB) {
        return dateB.localeCompare(dateA);
      }

      return Number(b.Year || 0) - Number(a.Year || 0);
    });

    renderAwards();

    function updateMemberHeader(key, name) {
      const displayName = name || key;

      document.getElementById("pageTitle").textContent = `Awards — ${displayName}`;
      document.getElementById("pageDesc").textContent = "Awards and recognitions associated with this EIDL member.";
      document.getElementById("memberNameText").textContent = displayName;
      document.getElementById("filterNote").style.display = "inline-block";
    }

    function isFalseValue(value) {
      const v = String(value || "").trim().toLowerCase();
      return v === "false" || v === "0" || v === "no" || v === "n";
    }

    function normalizeKey(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-");
    }

    function splitMemberKeys(value) {
      return String(value || "")
        .split(/[;,]/)
        .map(v => normalizeKey(v))
        .filter(Boolean);
    }

    function hasMemberKey(memberKeys, targetKey) {
      const keys = splitMemberKeys(memberKeys);
      const target = normalizeKey(targetKey);
      return keys.includes(target);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function groupByYear(items) {
      return items.reduce((acc, item) => {
        const year = item.Year || "Other";
        if (!acc[year]) acc[year] = [];
        acc[year].push(item);
        return acc;
      }, {});
    }

    function awardCard(a) {
      const title = escapeHtml(a.Title);
      const date = escapeHtml(a.Date);
      const imageUrl = String(a.Image || "").trim();

      const image = imageUrl
        ? `<img class="award-thumb" src="${escapeHtml(imageUrl)}" alt="award image" loading="lazy" decoding="async">`
        : `<div class="award-placeholder">EIDL<br>AWARD</div>`;

      return `
        <article class="award-card">
          ${image}

          <div class="award-body">
            <h2 class="award-title">${title}</h2>
            ${date ? `<p class="award-date">${date}</p>` : ""}
          </div>
        </article>
      `;
    }

    function renderAwards() {
      const list = document.getElementById("awardsList");

      if (!awards.length) {
        const message = memberKey
          ? "No awards found for this member."
          : "No awards found.";

        list.innerHTML = `<div class="empty">${message}</div>`;
        return;
      }

      const grouped = groupByYear(awards);
      const sortedYears = Object.keys(grouped).sort((a, b) => Number(b) - Number(a));

      list.innerHTML = sortedYears.map(year => {
        return `
          <section class="year-section">
            <h2 class="year-title">${escapeHtml(year)}</h2>
            <div class="award-grid">
              ${grouped[year].map(awardCard).join("")}
            </div>
          </section>
        `;
      }).join("");
    }
  </script>
</body>
</html>
