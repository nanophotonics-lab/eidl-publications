<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EIDL Awards</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #1f2937;
      padding: 26px 36px 40px;
    }

    .wrap {
      width: min(1400px, 96vw);
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 26px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 40px;
      line-height: 1.15;
      color: #111827;
      letter-spacing: -0.02em;
    }

    .desc {
      margin: 0;
      color: #667085;
      font-size: 15px;
      line-height: 1.6;
    }

    .year-section {
      margin-top: 34px;
    }

    .year-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 18px;
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }

    .year-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .award-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .award-card {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 20px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      align-items: start;
    }

    .award-thumb {
      width: 100%;
      height: 170px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid #e5e7eb;
      background: #f8fafc;
      display: block;
    }

    .award-placeholder {
      width: 100%;
      height: 170px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: linear-gradient(135deg, #eef3ff, #f8fafc);
      color: #344e7a;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.4;
    }

    .award-body {
      min-width: 0;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef3ff;
      color: #344e7a;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .tag.year {
      background: #f2f4f7;
      color: #475467;
    }

    .award-title {
      margin: 0 0 12px;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      color: #111827;
    }

    .award-title a {
      color: inherit;
      text-decoration: none;
    }

    .award-title a:hover {
      text-decoration: underline;
    }

    .award-summary {
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.5;
      color: #344054;
    }

    .award-summary strong {
      font-weight: 800;
      color: #111827;
    }

    .award-info {
      margin: 4px 0;
      font-size: 14px;
      color: #667085;
      line-height: 1.5;
    }

    .award-info strong {
      color: #344054;
      font-weight: 700;
    }

    .top-link {
      display: inline-block;
      margin-top: 10px;
      color: #263b63;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .top-link:hover {
      text-decoration: underline;
    }

    .empty {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 28px;
      color: #667085;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 1100px) {
      .award-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 18px;
      }

      .wrap {
        width: 100%;
      }

      h1 {
        font-size: 34px;
      }

      .year-title {
        font-size: 24px;
      }

      .award-card {
        grid-template-columns: 1fr;
      }

      .award-thumb,
      .award-placeholder {
        height: 220px;
      }

      .award-title {
        font-size: 22px;
      }

      .award-summary {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="page-header">
      <h1>Awards</h1>
      <p class="desc">Honors, prizes, and awards received by EIDL members.</p>
    </header>

    <div id="awardsList">Loading...</div>
  </div>

  <script src="./data.js"></script>

  <script>
    let awards = window.AWARDS || [];

    awards = awards
      .filter(a => a.Title)
      .filter(a => !isFalseValue(a.Visible))
      .sort((a, b) => {
        const dateA = String(a.Date || "");
        const dateB = String(b.Date || "");

        if (dateA && dateB) {
          return dateB.localeCompare(dateA);
        }

        return Number(b.Year || 0) - Number(a.Year || 0);
      });

    renderAwards();

    function isFalseValue(value) {
      const v = String(value || "").trim().toLowerCase();
      return v === "false" || v === "0" || v === "no" || v === "n";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function groupByYear(items) {
      return items.reduce((acc, item) => {
        const year = item.Year || "Other";
        if (!acc[year]) acc[year] = [];
        acc[year].push(item);
        return acc;
      }, {});
    }

    function makeSummary(a) {
      const recipient = String(a.Recipient || "").trim();
      const award = String(a.Award || "").trim();
      const organization = String(a.Organization || "").trim();

      if (recipient && award && organization) {
        return `<strong>${escapeHtml(recipient)}</strong> received <strong>${escapeHtml(award)}</strong> from ${escapeHtml(organization)}.`;
      }

      if (recipient && award) {
        return `<strong>${escapeHtml(recipient)}</strong> received <strong>${escapeHtml(award)}</strong>.`;
      }

      if (a.Description) {
        return escapeHtml(a.Description);
      }

      return "";
    }

    function awardCard(a) {
      const title = escapeHtml(a.Title);
      const award = escapeHtml(a.Award);
      const category = escapeHtml(a.Category);
      const year = escapeHtml(a.Year);
      const date = escapeHtml(a.Date);
      const link = String(a.Link || "").trim();
      const imageUrl = String(a.Image || "").trim();
      const summary = makeSummary(a);

      const image = imageUrl
        ? `<img class="award-thumb" src="${escapeHtml(imageUrl)}" alt="award image" loading="lazy" decoding="async">`
        : `<div class="award-placeholder">EIDL<br>AWARD</div>`;

      const titleHtml = link
        ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${title}</a>`
        : title;

      return `
        <article class="award-card">
          ${image}

          <div class="award-body">
            <div class="meta-row">
              ${category ? `<span class="tag">${category}</span>` : ""}
              ${year ? `<span class="tag year">${year}</span>` : ""}
            </div>

            <h2 class="award-title">${titleHtml}</h2>

            ${summary ? `<p class="award-summary">${summary}</p>` : ""}
            ${award ? `<p class="award-info"><strong>Award:</strong> ${award}</p>` : ""}
            ${date ? `<p class="award-info"><strong>Date:</strong> ${date}</p>` : ""}
            ${link ? `<a class="top-link" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">View details</a>` : ""}
          </div>
        </article>
      `;
    }

    function renderAwards() {
      const list = document.getElementById("awardsList");

      if (!awards.length) {
        list.innerHTML = `<div class="empty">No awards found.</div>`;
        return;
      }

      const grouped = groupByYear(awards);
      const sortedYears = Object.keys(grouped).sort((a, b) => Number(b) - Number(a));

      list.innerHTML = sortedYears.map(year => {
        return `
          <section class="year-section">
            <h2 class="year-title">${escapeHtml(year)}</h2>
            <div class="award-grid">
              ${grouped[year].map(awardCard).join("")}
            </div>
          </section>
        `;
      }).join("");
    }
  </script>
</body>
</html>
