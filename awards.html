<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EIDL Awards</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #1f2937;
      padding: 28px;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 36px;
      line-height: 1.2;
      color: #111827;
      letter-spacing: -0.02em;
    }

    .desc {
      margin: 0;
      color: #667085;
      font-size: 15px;
      line-height: 1.65;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 12px;
      margin: 24px 0 30px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      background: #ffffff;
      font-size: 14px;
      color: #111827;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #263b63;
      box-shadow: 0 0 0 3px rgba(38, 59, 99, 0.12);
    }

    .year-section {
      margin-top: 34px;
    }

    .year-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
      font-size: 24px;
      font-weight: 800;
      color: #111827;
    }

    .year-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .award-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .award-card {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 18px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.055);
      min-height: 160px;
    }

    .award-thumb {
      width: 100%;
      height: 128px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid #e5e7eb;
      background: linear-gradient(135deg, #eef3ff, #f8fafc);
    }

    .award-placeholder {
      width: 100%;
      height: 128px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: linear-gradient(135deg, #eef3ff, #f8fafc);
      color: #344e7a;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.4;
    }

    .award-body {
      min-width: 0;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 9px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef3ff;
      color: #344e7a;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .tag.year {
      background: #f2f4f7;
      color: #475467;
    }

    .award-title {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.4;
      color: #111827;
    }

    .award-title a {
      color: inherit;
      text-decoration: none;
    }

    .award-title a:hover {
      text-decoration: underline;
    }

    .award-info {
      margin: 0 0 5px;
      font-size: 13.5px;
      color: #475467;
      line-height: 1.45;
    }

    .award-info strong {
      color: #344054;
      font-weight: 700;
    }

    .description {
      margin: 9px 0 0;
      font-size: 13px;
      color: #667085;
      line-height: 1.55;
    }

    .empty {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 28px;
      color: #667085;
      text-align: center;
      font-size: 14px;
    }

    .top-link {
      display: inline-block;
      margin-top: 12px;
      color: #263b63;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .top-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .award-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      body {
        padding: 18px;
      }

      h1 {
        font-size: 30px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .award-card {
        grid-template-columns: 1fr;
      }

      .award-thumb,
      .award-placeholder {
        height: 180px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="page-header">
      <h1>Awards</h1>
      <p class="desc">
        Honors, prizes, and awards received by EIDL members.
      </p>
    </header>

    <div class="controls">
      <input id="searchInput" type="text" placeholder="Search awards..." oninput="renderAwards()">

      <select id="categoryFilter" onchange="renderAwards()">
        <option value="All">All Categories</option>
      </select>

      <select id="yearFilter" onchange="renderAwards()">
        <option value="All">All Years</option>
      </select>
    </div>

    <div id="awardsList">Loading...</div>
  </div>

  <script src="./data.js"></script>

  <script>
    let awards = window.AWARDS || [];

    awards = awards
      .filter(a => a.Title)
      .filter(a => !isFalseValue(a.Visible))
      .sort((a, b) => {
        const dateA = String(a.Date || "");
        const dateB = String(b.Date || "");

        if (dateA && dateB) {
          return dateB.localeCompare(dateA);
        }

        return Number(b.Year || 0) - Number(a.Year || 0);
      });

    initFilters();
    renderAwards();

    function isFalseValue(value) {
      const v = String(value || "").trim().toLowerCase();
      return v === "false" || v === "0" || v === "no" || v === "n";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function initFilters() {
      const categorySelect = document.getElementById("categoryFilter");
      const yearSelect = document.getElementById("yearFilter");

      const categories = [...new Set(awards.map(a => a.Category).filter(Boolean))].sort();
      const years = [...new Set(awards.map(a => a.Year).filter(Boolean))]
        .sort((a, b) => Number(b) - Number(a));

      categories.forEach(category => {
        const opt = document.createElement("option");
        opt.value = category;
        opt.textContent = category;
        categorySelect.appendChild(opt);
      });

      years.forEach(year => {
        const opt = document.createElement("option");
        opt.value = year;
        opt.textContent = year;
        yearSelect.appendChild(opt);
      });
    }

    function getFilteredAwards() {
      const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
      const category = document.getElementById("categoryFilter").value;
      const year = document.getElementById("yearFilter").value;

      return awards.filter(a => {
        const categoryMatch = category === "All" || a.Category === category;
        const yearMatch = year === "All" || String(a.Year) === String(year);

        const text = `
          ${a.Title || ""}
          ${a.Recipient || ""}
          ${a.Award || ""}
          ${a.Organization || ""}
          ${a.Category || ""}
          ${a.Description || ""}
          ${a.Year || ""}
          ${a.Date || ""}
        `.toLowerCase();

        return categoryMatch && yearMatch && text.includes(keyword);
      });
    }

    function groupByYear(items) {
      return items.reduce((acc, item) => {
        const year = item.Year || "Other";
        if (!acc[year]) acc[year] = [];
        acc[year].push(item);
        return acc;
      }, {});
    }

    function awardCard(a) {
      const title = escapeHtml(a.Title);
      const recipient = escapeHtml(a.Recipient);
      const award = escapeHtml(a.Award);
      const organization = escapeHtml(a.Organization);
      const category = escapeHtml(a.Category);
      const year = escapeHtml(a.Year);
      const date = escapeHtml(a.Date);
      const description = escapeHtml(a.Description);
      const link = String(a.Link || "").trim();
      const imageUrl = String(a.Image || "").trim();

      const image = imageUrl
        ? `<img class="award-thumb" src="${escapeHtml(imageUrl)}" alt="award image" loading="lazy" decoding="async">`
        : `<div class="award-placeholder">EIDL<br>AWARD</div>`;

      const titleHtml = link
        ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${title}</a>`
        : title;

      return `
        <article class="award-card">
          ${image}

          <div class="award-body">
            <div class="meta-row">
              ${category ? `<span class="tag">${category}</span>` : ""}
              ${year ? `<span class="tag year">${year}</span>` : ""}
            </div>

            <h2 class="award-title">${titleHtml}</h2>

            ${recipient ? `<p class="award-info"><strong>Recipient:</strong> ${recipient}</p>` : ""}
            ${award ? `<p class="award-info"><strong>Award:</strong> ${award}</p>` : ""}
            ${organization ? `<p class="award-info"><strong>Organization:</strong> ${organization}</p>` : ""}
            ${date ? `<p class="award-info"><strong>Date:</strong> ${date}</p>` : ""}

            ${description ? `<p class="description">${description}</p>` : ""}
            ${link ? `<a class="top-link" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">View details</a>` : ""}
          </div>
        </article>
      `;
    }

    function renderAwards() {
      const list = document.getElementById("awardsList");
      const filtered = getFilteredAwards();

      if (!filtered.length) {
        list.innerHTML = `<div class="empty">No awards found.</div>`;
        return;
      }

      const grouped = groupByYear(filtered);
      const sortedYears = Object.keys(grouped).sort((a, b) => Number(b) - Number(a));

      list.innerHTML = sortedYears.map(year => {
        return `
          <section class="year-section">
            <h2 class="year-title">${escapeHtml(year)}</h2>
            <div class="award-grid">
              ${grouped[year].map(awardCard).join("")}
            </div>
          </section>
        `;
      }).join("");
    }
  </script>
</body>
</html>
